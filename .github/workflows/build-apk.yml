name: Build AetherAI Instant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Buat Proyek Aplikasi Native Mandiri
        run: |
          mkdir -p myapp/app/src/main/java/com/aether/terminal
          mkdir -p myapp/app/src/main/res/values
          mkdir -p myapp/app/src/main/res/mipmap-anydpi-v26

          # Buat AndroidManifest.xml
          cat << 'END_MANIFEST' > myapp/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.aether.terminal">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Aether Terminal AI"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          END_MANIFEST

          # Buat build.gradle
          cat << 'END_GRADLE' > myapp/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.aether.terminal'
              compileSdk 34
              defaultConfig {
                  applicationId "com.aether.terminal"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                release {
                    minifyEnabled false
                }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_7
                  targetCompatibility JavaVersion.VERSION_1_7
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          END_GRADLE

          # Buat settings.gradle
          cat << 'END_SETTINGS' > myapp/settings.gradle
          rootProject.name = "AetherTerminal"
          include ':app'
          END_SETTINGS

          # Buat build.gradle tingkat root
          cat << 'END_ROOT' > myapp/build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          END_ROOT

          # Buat MainActivity.kt dengan Terminal Shell & Python Runner Sungguhan
          cat << 'END_MAIN' > myapp/app/src/main/java/com/aether/terminal/MainActivity.kt
          package com.aether.terminal

          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.io.BufferedReader
          import java.io.InputStreamReader

          class MainActivity : AppCompatActivity() {
              private lateinit var outputLog: TextView
              private lateinit var commandInput: EditText
              private lateinit var runButton: Button
              private lateinit var clearButton: Button
              private val logBuilder = StringBuilder()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(android.graphics.Color.parseColor("#030712"))
                  }

                  val title = TextView(this).apply {
                      text = "⚡ AetherAI Terminal & Shell"
                      textSize = 18f
                      setTextColor(android.graphics.Color.parseColor("#34D399"))
                      setPadding(0, 0, 0, 16)
                  }
                  layout.addView(title)

                  outputLog = TextView(this).apply {
                      textSize = 12f
                      setTextColor(android.graphics.Color.parseColor("#E2E8F0"))
                      typeface = android.graphics.Typeface.MONOSPACE
                  }
                  
                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f
                      )
                      setBackgroundColor(android.graphics.Color.parseColor("#000000"))
                      setPadding(12, 12, 12, 12)
                      addView(outputLog)
                  }
                  layout.addView(scroll)

                  val inputLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 16, 0, 0)
                  }

                  commandInput = EditText(this).apply {
                      hint = "Ketik perintah (cth: ls, pwd, python)..."
                      setTextColor(android.graphics.Color.WHITE)
                      setHintTextColor(android.graphics.Color.GRAY)
                      textSize = 14f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  inputLayout.addView(commandInput)

                  runButton = Button(this).apply {
                      text = "Eksekusi"
                      setBackgroundColor(android.graphics.Color.parseColor("#059669"))
                      setTextColor(android.graphics.Color.WHITE)
                      setOnClickListener {
                          val cmd = commandInput.text.toString().trim()
                          if (cmd.isNotEmpty()) {
                              appendLog("$ $cmd")
                              commandInput.setText("")
                              executeShell(cmd)
                          }
                      }
                  }
                  inputLayout.addView(runButton)
                  layout.addView(inputLayout)

                  clearButton = Button(this).apply {
                      text = "Bersihkan Layar Terminal"
                      setBackgroundColor(android.graphics.Color.parseColor("#1E293B"))
                      setTextColor(android.graphics.Color.parseColor("#38BDF8"))
                      setOnClickListener {
                          logBuilder.clear()
                          outputLog.text = ""
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setTopMargin(12) }
                  }
                  layout.addView(clearButton)

                  setContentView(layout)
                  appendLog("Selamat datang di AetherAI Terminal!\nJalankan perintah sistem atau uji skrip langsung di sini.\n")
              }

              private fun appendLog(text: String) {
                  logBuilder.append(text).append("\n")
                  outputLog.text = logBuilder.toString()
              }

              private fun executeShell(command: String) {
                  Thread {
                      try {
                          val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", command))
                          val reader = BufferedReader(InputStreamReader(process.inputStream))
                          val errReader = BufferedReader(InputStreamReader(process.errorStream))
                          
                          val res = StringBuilder()
                          var line: String?
                          while (reader.readLine().also { line = it } != null) {
                              res.append(line).append("\n")
                          }
                          while (errReader.readLine().also { line = it } != null) {
                              res.append(line).append("\n")
                          }
                          process.waitFor()
                          
                          val output = res.toString().trim()
                          runOnUiThread {
                              if (output.isNotEmpty()) {
                                  appendLog(output)
                              } else {
                                  appendLog("Perintah selesai tanpa output.")
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              appendLog("Error: ${e.message}")
                          }
                      }
                  }.start()
              }
          }
          END_MAIN

      - name: Kompilasi APK Instan
        working-directory: myapp
        run: |
          chmod +x gradlew || true
          gradle wrapper
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Terminal-APK
          path: myapp/app/build/outputs/apk/debug/*.apk
