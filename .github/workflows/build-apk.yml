name: Build AetherAI Multimodal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK & NDK with License Agreement
        uses: android-actions/setup-android@v2

      - name: Install NDK and Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Clone Mesin Resmi llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama_repo

      - name: Salin Kustomisasi UI AetherAI
        run: |
          cp -r custom_app/* llama_repo/examples/llama.android/

      - name: Kompilasi APK (Debug)
        working-directory: llama_repo/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: AetherAI-Multimodal-APK
          path: llama_repo/examples/llama.android/app/build/outputs/apk/debug/*.apk
