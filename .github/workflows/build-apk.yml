name: Build AetherTerminal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Manually
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Buat Proyek APK Terminal
        run: |
          mkdir -p myapp/app/src/main/java/com/aether/terminal
          mkdir -p myapp/app/src/main/res/values

          cat << 'END_MANIFEST' > myapp/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.aether.terminal">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Aether Terminal"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          END_MANIFEST

          cat << 'END_GRADLE' > myapp/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.aether.terminal'
              compileSdk 34
              defaultConfig {
                  applicationId "com.aether.terminal"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          END_GRADLE

          cat << 'END_SETTINGS' > myapp/settings.gradle
          rootProject.name = "AetherTerminal"
          include ':app'
          END_SETTINGS

          cat << 'END_ROOT' > myapp/build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          END_ROOT

          cat << 'END_MAIN' > myapp/app/src/main/java/com/aether/terminal/MainActivity.kt
          package com.aether.terminal

          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.io.BufferedReader
          import java.io.InputStreamReader

          class MainActivity : AppCompatActivity() {
              private lateinit var outputLog: TextView
              private lateinit var commandInput: EditText
              private val logBuilder = StringBuilder()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(android.graphics.Color.parseColor("#030712"))
                  }
                  val title = TextView(this).apply {
                      text = "⚡ AetherAI Terminal Shell"
                      textSize = 18f
                      setTextColor(android.graphics.Color.parseColor("#34D399"))
                      setPadding(0, 0, 0, 16)
                  }
                  layout.addView(title)

                  outputLog = TextView(this).apply {
                      textSize = 12f
                      setTextColor(android.graphics.Color.parseColor("#E2E8F0"))
                      typeface = android.graphics.Typeface.MONOSPACE
                  }
                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                      setBackgroundColor(android.graphics.Color.parseColor("#000000"))
                      setPadding(12, 12, 12, 12)
                      addView(outputLog)
                  }
                  layout.addView(scroll)

                  val inputLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 16, 0, 0)
                  }
                  commandInput = EditText(this).apply {
                      hint = "Ketik perintah cth: ls, pwd..."
                      setTextColor(android.graphics.Color.WHITE)
                      setHintTextColor(android.graphics.Color.GRAY)
                      textSize = 14f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  inputLayout.addView(commandInput)

                  val runButton = Button(this).apply {
                      text = "Jalankan"
                      setBackgroundColor(android.graphics.Color.parseColor("#059669"))
                      setTextColor(android.graphics.Color.WHITE)
                      setOnClickListener {
                          val cmd = commandInput.text.toString().trim()
                          if (cmd.isNotEmpty()) {
                              appendLog("$ $cmd")
                              commandInput.setText("")
                              executeShell(cmd)
                          }
                      }
                  }
                  inputLayout.addView(runButton)
                  layout.addView(inputLayout)
                  setContentView(layout)
                  appendLog("Terminal siap digunakan.\n")
              }

              private fun appendLog(text: String) {
                  logBuilder.append(text).append("\n")
                  outputLog.text = logBuilder.toString()
              }

              private fun executeShell(command: String) {
                  Thread {
                      try {
                          val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", command))
                          val reader = BufferedReader(InputStreamReader(process.inputStream))
                          val res = StringBuilder()
                          var line: String?
                          while (reader.readLine().also { line = it } != null) {
                              res.append(line).append("\n")
                          }
                          process.waitFor()
                          runOnUiThread { appendLog(res.toString().trim()) }
                      } catch (e: Exception) {
                          runOnUiThread { appendLog("Error: ${e.message}") }
                      }
                  }.start()
              }
          }
          END_MAIN

      - name: Build APK Clean Manual
        working-directory: myapp
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Terminal-APK
          path: myapp/app/build/outputs/apk/debug/*.apk
