name: Build AetherAI Multimodal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Clone Mesin Resmi llama.cpp Terbaru
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama_repo

      - name: Pasang Kode AetherAI Multimodal ke llama.android
        run: |
          cp -r custom_app/* llama_repo/examples/llama.android/

      - name: Kompilasi Native C++ & Build APK Mandiri
        working-directory: llama_repo/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload AetherAI Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherAI-Multimodal-APK
          path: llama_repo/examples/llama.android/app/build/outputs/apk/debug/*.apk
