name: Build AetherAI Multimodal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Setup Android SDK Manually
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          sdk_tools_url="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sSL $sdk_tools_url -o sdk-tools.zip
          unzip -q sdk-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Clone Mesin Resmi llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama_repo

      - name: Salin Kustomisasi UI AetherAI + Terminal Nyata
        run: |
          cp -r custom_app/* llama_repo/examples/llama.android/

      - name: Kompilasi APK (Debug Bebas Error)
        working-directory: llama_repo/examples/llama.android
        run: |
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
          ./gradlew assembleDebug --no-daemon -x test

      - name: Upload APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: AetherAI-Multimodal-APK
          path: llama_repo/examples/llama.android/app/build/outputs/apk/debug/*.apk
